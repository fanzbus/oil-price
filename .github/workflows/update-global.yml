name: update-global
on:
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC，EU 与 FRED 均为周更，不要高频
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install deps (openpyxl for EU xlsx)
        run: pip install openpyxl
      - name: Fetch global prices (EU + FRED + China avg)
        run: python3 scripts/fetch_global.py
      - name: Commit if changed
        run: |
          git config user.name "oil-price-bot"
          git config user.email "bot@example.com"
          git add data/global.json public/data/global.json data/meta.json public/data/meta.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): update global $(date -u +%F)"
            # remote 可能已被其他 workflow 提交先行推进：rebase 后再推，带重试
            for i in 1 2 3; do
              git fetch origin main && git rebase origin/main && git push && break
              echo "push failed, retry $i"
              sleep 5
            done
          fi
