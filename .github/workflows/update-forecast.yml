name: update-forecast
on:
  schedule:
    - cron: "0 * * * *"  # 每小时整点；scrape.py --forecast-only 内判断交易时段，休市跳过不写文件
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Update forecast only (hourly, skip when market closed)
        run: python3 scripts/scrape.py --forecast-only
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "oil-price-bot"
          git config user.email "bot@example.com"
          # forecast.json + meta.json（--forecast-only 会同步 meta 的 forecast_status）
          git add data/forecast.json public/data/forecast.json data/meta.json public/data/meta.json
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update forecast $(date -u +%F-%H)"
            # remote 可能已被其他 workflow 提交先行推进：rebase 后再推，带重试
            for i in 1 2 3; do
              git fetch origin main && git rebase origin/main && git push && break
              echo "push failed, retry $i"
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "ab179d59d7f0e869521a866793951790"
