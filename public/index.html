<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="31 省 92/95/98 号汽油与 0 号柴油价格，历史走势、调价预测、加油计算器与公开 API。">

<script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.setAttribute('data-theme','light');}}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>

canvas{width:100%;height:auto;max-height:280px}

<body class="bg-base-100 font-sans antialiased">
<header class="navbar sticky top-0 z-40 border-b border-base-300 bg-base-100/90 shadow-sm backdrop-blur">
  <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center justify-between gap-x-3 gap-y-2 px-4 sm:px-6">
    <a href="/" class="flex items-center gap-3">
      <img src="/logo.png" alt="今日油价" width="40" height="40" style="width:40px;height:40px" class="h-10 w-10 shrink-0 rounded-xl shadow-sm">
      <span>
        <span class="block text-[17px] font-bold leading-tight tracking-tight">今日油价</span>
        
      </span>
    </a>
    <nav class="flex flex-wrap items-center gap-1 sm:flex-nowrap sm:overflow-x-auto">
      <a href="/" data-nav="/" class="btn btn-ghost btn-sm">今日油价</a>
      <a href="/trend" data-nav="/trend" class="btn btn-ghost btn-sm">走势</a>
      <a href="/tools" data-nav="/tools" class="btn btn-ghost btn-sm">工具</a>
      <a href="/forecast" data-nav="/forecast" class="btn btn-ghost btn-sm">预测</a>
      <a href="/api-docs" data-nav="/api-docs" class="btn btn-ghost btn-sm hidden sm:inline-flex">API 文档</a>
      <label class="sr-only" for="topProvince">当前省份</label>
      <select id="topProvince" data-province-select class="select select-bordered select-sm w-24"></select>

</header>
<main class="mx-auto max-w-6xl space-y-4 px-4 pb-16 pt-4 sm:px-6 sm:pt-6">

<section class="card overflow-hidden border border-base-300/60 bg-gradient-to-br from-primary/[0.06] via-base-200 to-base-200 shadow-md shadow-primary/5">
  <div class="card-body p-4 sm:p-5">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <p class="text-[13px] opacity-70">今日 92 均价</p>
        <div class="mt-1 flex items-baseline gap-2">
          <span id="heroP92" class="text-[32px] sm:text-[40px] font-bold leading-none tracking-tight tabular-nums">—</span>
          <span class="text-sm opacity-70">元 / 升</span>
        </div>
        <p id="metaLine" class="mt-1 text-xs opacity-70">加载中…</p>
      </div>
      <div class="w-full shrink-0 lg:w-[300px]">
        <div id="adjustPill" class="flex flex-wrap gap-1.5"></div>
        <div class="mt-1.5">
          <div class="flex items-center justify-between text-xs opacity-70" title="按约 14 天为一周期估算">
            <span id="cycleLabel">本轮周期进度 · 约 14 天</span>
            <span id="cyclePct" class="font-medium tabular-nums"></span>
          </div>
          <progress id="cycleBar" class="progress progress-primary mt-1 h-1.5 w-full" value="0" max="100"></progress>
          <p id="countdown" class="mt-1 text-xs opacity-70"></p>
        </div>
      </div>
    </div>
    <div class="card mt-5 bg-base-100">
      <div class="card-body p-4">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <p class="text-sm font-semibold">当前省份：<span id="currentProvinceName">上海</span></p>
        </div>
        <div id="currentProvincePrices" class="mt-2 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>
      </div>
    </div>
    <p id="interpretation" class="mt-5 border-t border-base-300 pt-4 text-sm leading-relaxed opacity-80"></p>
    <div id="aiCard" class="mt-4 rounded-xl border border-base-300 bg-base-100 p-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <p class="text-sm font-semibold">AI 解读 · 国际油价趋势预测 <span id="aiTime" class="ml-1 text-xs font-normal opacity-70"></span></p>
        <span id="aiBadge"><span class="badge badge-ghost whitespace-nowrap">加载中…</span></span>
      </div>
      <div id="aiTrendChips" class="mt-2 flex flex-wrap gap-1.5"></div>
      <p id="aiText" class="mt-2 text-sm leading-relaxed opacity-80"><span class="skeleton inline-block h-4 w-full"></span></p>
      <p id="aiMeta" class="mt-2 text-xs opacity-70"></p>
    </div>
    <div id="avgGrid" class="stats stats-vertical mt-5 w-full shadow-sm sm:stats-horizontal"></div>
  </div>
</section>

<section class="card border border-base-300/60 bg-base-200 shadow-md shadow-base-300/20">
  <div class="card-body">
    <div class="flex items-center justify-between gap-3">
      <h2 class="card-title text-[15px]">查询与排行</h2>
      <p class="hidden text-xs opacity-70 sm:block" id="diffHint">价差以与当前省份 92 对比</p>
    </div>
    <div class="mt-4 flex flex-col gap-3 md:flex-row">
      <label class="input input-bordered flex flex-1 items-center gap-2">
        <svg class="h-4 w-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="q" class="grow" placeholder="搜索省份，如 上海 / 广东">
      </label>
      <div class="flex gap-3">
        <label class="sr-only" for="sortSel">排序油号</label>
        <select id="sortSel" class="select select-bordered"><option value="p92">按 92 排序</option><option value="p95">按 95 排序</option><option value="p98">按 98 排序</option><option value="d0">按 0号柴油排序</option></select>
        <button id="sortDir" class="btn btn-outline">↓ 降序</button>
      </div>
    </div>
    <div id="oilTabs" role="tablist" class="tabs tabs-box mt-3 overflow-x-auto whitespace-nowrap"></div>
    <div class="mt-4 max-h-[560px] overflow-auto rounded-xl border border-base-300">
      <table class="table w-full min-w-[640px] text-sm">
        <thead><tr>
          <th scope="col" class="sticky top-0 z-20 bg-base-200">省份</th>
          <th scope="col" id="thP92" class="sticky top-0 z-20 bg-base-200">92号汽油</th>
          <th scope="col" id="thP95" class="sticky top-0 z-20 bg-base-200">95号汽油</th>
          <th scope="col" id="thP98" class="sticky top-0 z-20 bg-base-200">98号汽油</th>
          <th scope="col" id="thD0" class="sticky top-0 z-20 bg-base-200">0号柴油</th>
          <th scope="col" id="diffHeader" class="sticky top-0 z-20 bg-base-200">与当前省份 92 价差</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="mt-3 grid gap-3 md:grid-cols-2">
      <div class="card bg-base-100">
        <div class="card-body p-4">
          <div class="flex items-center justify-between"><p class="text-sm font-semibold">最贵 Top 3</p><span class="text-xs opacity-70">按当前油号</span></div>
          <div id="topExp" class="mt-2"></div>
        </div>
      </div>
      <div class="card bg-base-100">
        <div class="card-body p-4">
          <div class="flex items-center justify-between"><p class="text-sm font-semibold">最便宜 Top 3</p><span class="text-xs opacity-70">按当前油号</span></div>
          <div id="topCheap" class="mt-2"></div>
        </div>
      </div>
    </div>
  </div>
</section>

</main>
<footer class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-3 gap-y-1 px-4 py-6 text-xs opacity-70 sm:px-6">
  <span>数据来源：<a href="http://www.qiyoujiage.com/" class="font-medium underline underline-offset-2 hover:text-primary">qiyoujiage.com</a> · 仅供参考，以国家发改委官方通知为准</span>
  <span class="flex gap-3"><a href="/health" class="hover:text-base-content">状态</a><a href="https://github.com/fanzbus/oil-price" class="hover:text-base-content">GitHub</a></span>
</footer>
<script>
let DATA = null;
let OIL = 'p92', DESC = true;
let LATEST_DELTA = null, LATEST_DELTA_DATE = '';
function deltaSmall(k) {
  if (!LATEST_DELTA || LATEST_DELTA[k] == null) return '';
  const v = LATEST_DELTA[k];
  const txt = v > 0 ? `+${v.toFixed(2)}` : v < 0 ? v.toFixed(2) : '±0.00';
  const cls = v > 0 ? 'text-error' : v < 0 ? 'text-success' : 'opacity-50';
  return ` <span class="text-[11px] font-normal tabular-nums ${cls}">${txt}</span>`;
}
function cycleProgress() {
  if (!DATA || !DATA.next_adjustment) return;
  const now = new Date(), t = new Date(DATA.next_adjustment);
  const bar = document.getElementById('cycleBar');
  const lab = document.getElementById('cyclePct');
  const label = document.getElementById('cycleLabel');
  if (t <= now) {
    // 已过期：本轮已结束，不再卡 100% + 即将调整
    if (bar) bar.value = 100;
    if (lab) lab.textContent = '已结束';
    if (label) label.textContent = '本轮已结束，等待源站更新';
    return;
  }
  const remainH = Math.max(0, (t - now) / 3600000);
  const pct = Math.min(100, Math.max(2, Math.round(100 - remainH / 336 * 100)));
  if (bar) bar.value = pct;
  if (lab) lab.textContent = pct + '%';
  if (label) label.textContent = '本轮周期进度 · 约 14 天';
}
function renderPrices() {
  if (!DATA) return;
  document.getElementById('metaLine').textContent = `更新于 ${fmtDateTime(DATA.fetched_at)}`;
  const nextT = DATA.next_adjustment ? new Date(DATA.next_adjustment) : null;
  const expired = nextT && nextT <= new Date();
  document.getElementById('adjustPill').innerHTML = expired
    ? `<span class="badge badge-ghost whitespace-nowrap">上次调整：${DATA.next_adjustment_label || '—'}</span><span id="statusBadge" class="badge badge-ghost whitespace-nowrap">${DATA.adjustment_status || ''}</span>`
    : `<span class="badge badge-primary badge-soft whitespace-nowrap">下次调整：${DATA.next_adjustment_label || '—'}</span><span id="statusBadge" class="badge badge-ghost whitespace-nowrap">${DATA.adjustment_status || ''}</span>`;
  applyForecastPill();
  document.getElementById('interpretation').textContent = DATA.interpretation || '';
  const avg = DATA.national_avg || {};
  document.getElementById('heroP92').textContent = fmt(avg.p92);
  document.getElementById('avgGrid').innerHTML = OIL_KEYS.map(k => `<div class="stat"><div class="stat-title text-xs">全国均价 · ${KEY[k]}</div><div class="stat-value text-2xl tabular-nums">${fmt(avg[k])}${deltaSmall(k)}</div><div class="stat-desc">元 / 升</div></div>`).join('');
  const t = new Date(DATA.next_adjustment); const now = new Date();
  const expired2 = DATA.next_adjustment && t <= now;
  document.getElementById('countdown').textContent = !DATA.next_adjustment ? '' : expired2 ? '源站尚未公布下次调整时间' : `距离下次调整 ${fmtCountdown(DATA.next_adjustment)}`;
  cycleProgress();
  const cur = DATA.provinces.find(r => r.province === CURRENT) || DATA.provinces[0];
  document.getElementById('currentProvinceName').textContent = cur.province;
  document.getElementById('currentProvincePrices').innerHTML = OIL_KEYS.map(k => `<div><p class="text-xs opacity-70">${KEY[k]}</p><p class="mt-0.5 text-xl font-bold tracking-tight tabular-nums">${fmt(cur[k])}${deltaSmall(k)}</p></div>`).join('');
  const dh = document.getElementById('diffHeader'); if (dh) dh.textContent = `与${CURRENT} 92 价差`;
  const hint = document.getElementById('diffHint'); if (hint) hint.textContent = `价差以与${CURRENT} 92 对比${LATEST_DELTA_DATE ? ` · 价格后为上次调价（${LATEST_DELTA_DATE}）调整幅度` : ''}`;
  const sortSel = document.getElementById('sortSel'); if (sortSel) sortSel.value = OIL;
  const tabs = document.getElementById('oilTabs');
  tabs.innerHTML = OIL_KEYS.map(k => `<button role="tab" data-k="${k}" class="tab ${k === OIL ? 'tab-active' : ''}">${KEY[k]}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => { OIL = b.dataset.k; renderPrices(); });
  renderTable(); renderRank();
}
function filteredRows() {
  const q = (document.getElementById('q').value || '').trim();
  let rows = DATA.provinces.filter(r => !q || r.province.includes(q));
  rows = [...rows].sort((a, b) => DESC ? b[OIL] - a[OIL] : a[OIL] - b[OIL]);
  return rows;
}
function renderTable() {
  if (!DATA) return;
  const rows = filteredRows();
  const cur = DATA.provinces.find(r => r.province === CURRENT);
  for (const k of OIL_KEYS) {
    const th = document.getElementById({ p92: 'thP92', p95: 'thP95', p98: 'thP98', d0: 'thD0' }[k]);
    if (th) th.classList.toggle('text-primary', k === OIL);
  }
  if (!rows.length) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="6" class="py-10 text-center"><p class="text-sm font-medium">没有匹配的省份</p><p class="mt-1 text-xs opacity-70">换个关键词试试，例如“上海 / 广东”</p></td></tr>';
    return;
  }
  // 当前省份置顶固定：从排序结果中抽出，放在第一行，sticky 在表头下方滚动不动；
  // 搜索过滤掉当前省份时则不置顶，只显示过滤结果。表格不分页，全部显示。
  let ordered = rows;
  const curInRows = cur ? rows.find(r => r.province === CURRENT) : null;
  if (curInRows) {
    ordered = [curInRows, ...rows.filter(r => r.province !== CURRENT)];
  }
  document.getElementById('tbody').innerHTML = ordered.map(r => {
    const diff = cur ? (r.p92 - cur.p92) : null;
    const diffHtml = diff == null ? '—' : diff === 0 ? '<span class="tabular-nums opacity-70">±0.00</span>' : diff > 0 ? `<span class="font-semibold text-error tabular-nums">↑ ${diff.toFixed(2)}</span>` : `<span class="font-semibold text-success tabular-nums">↓ ${Math.abs(diff).toFixed(2)}</span>`;
    const cell = (k) => `<td class="tabular-nums ${k === OIL ? 'bg-primary/10 font-bold' : ''}">${fmt(r[k])}${deltaSmall(k)}</td>`;
    const isCur = r.province === CURRENT;
    if (isCur) {
      return `<tr class="sticky top-11 z-10 bg-base-200 shadow-[0_1px_0_0_var(--color-base-300)]"><td class="font-medium">${r.province}<span class="badge badge-primary badge-soft ml-2 whitespace-nowrap">当前</span></td>${cell('p92')}${cell('p95')}${cell('p98')}${cell('d0')}<td>${diffHtml}</td></tr>`;
    }
    return `<tr><td class="font-medium">${r.province}</td>${cell('p92')}${cell('p95')}${cell('p98')}${cell('d0')}<td>${diffHtml}</td></tr>`;
  }).join('');
}
function renderRank() {
  const s = [...DATA.provinces].sort((a, b) => b[OIL] - a[OIL]);
  const row = (r, i) => `<div class="flex items-center justify-between py-1.5 text-sm"><span class="flex items-center gap-2"><span class="badge badge-ghost">${i + 1}</span><span>${r.province}</span></span><span class="font-semibold tabular-nums">${fmt(r[OIL])}</span></div>`;
  document.getElementById('topExp').innerHTML = s.slice(0, 3).map(row).join('');
  document.getElementById('topCheap').innerHTML = s.slice(-3).reverse().map(row).join('');
}
function pctChip(label, v) {
  if (v == null) return '';
  const cls = v > 0 ? 'badge-error' : v < 0 ? 'badge-success' : 'badge-ghost';
  const arrow = v > 0 ? '↑' : v < 0 ? '↓' : '—';
  return `<span class="badge ${cls} badge-soft whitespace-nowrap">${label} ${arrow} ${v > 0 ? '+' : ''}${v}%</span>`;
}
async function renderAi() {
  const textEl = document.getElementById('aiText');
  const badgeEl = document.getElementById('aiBadge');
  const chipsEl = document.getElementById('aiTrendChips');
  const metaEl = document.getElementById('aiMeta');
  if (!textEl) return;
  try {
    const d = await j(`/api/ai-interpretation?province=${encodeURIComponent(CURRENT)}`);
    const f = d.facts_used || {};
    if (badgeEl) badgeEl.innerHTML = d.source === 'workers-ai'
      ? '<span class="badge badge-primary badge-soft whitespace-nowrap">AI 解读</span>'
      : '<span class="badge badge-ghost whitespace-nowrap">规则解读（AI 暂不可用）</span>';
    // 趋势指标条：只用 facts 里的确定性数字，不解析 AI 文本，兜底时也正确
    const chips = [];
    if (f.brent) chips.push(pctChip('Brent', f.brent.change_rate_pct));
    if (f.wti) chips.push(pctChip('WTI', f.wti.change_rate_pct));
    if (f.change_rate_pct != null) chips.push(pctChip('一揽子', f.change_rate_pct));
    if (f.forecast_direction && f.estimated_adjustment_yuan_per_ton != null) {
      const dirCls = f.estimated_adjustment_yuan_per_ton > 0 ? 'badge-error' : f.estimated_adjustment_yuan_per_ton < 0 ? 'badge-success' : 'badge-ghost';
      chips.push(`<span class="badge ${dirCls} badge-soft whitespace-nowrap">预计${f.forecast_direction} ${f.estimated_adjustment_yuan_per_ton} 元/吨</span>`);
    }
    if (f.delta_per_liter && f.delta_per_liter.p92 != null) {
      const dv = f.delta_per_liter.p92;
      const dCls = dv > 0 ? 'badge-error' : dv < 0 ? 'badge-success' : 'badge-ghost';
      chips.push(`<span class="badge ${dCls} badge-soft whitespace-nowrap">每升 ${dv > 0 ? '+' : ''}${dv.toFixed(3)} 元</span>`);
    }
    chipsEl.innerHTML = chips.join('') || '<span class="text-xs opacity-70">暂无预测数据</span>';
    textEl.textContent = d.interpretation || '';
    const timeEl = document.getElementById('aiTime');
    if (timeEl && d.generated_at) timeEl.textContent = `解读时间：${fmtDateTime(d.generated_at)}`;
    metaEl.textContent = 'AI 解读基于当前数据分析，不产生新的预测；正式结果以国家发改委官方通知为准。';
  } catch (e) {
    textEl.textContent = 'AI 解读暂不可用，下方价格表仍可查看。';
    if (badgeEl) badgeEl.innerHTML = '<span class="badge badge-ghost whitespace-nowrap">暂不可用</span>';
    metaEl.textContent = 'AI 解读基于当前数据分析，不产生新的预测；正式结果以国家发改委官方通知为准。';
  }
}
// 状态徽章：预测涨跌幅超过调价门槛（|预估| ≥ 50 元/吨）时，红框位置改显示预测；未超门槛保持源站状态
let FORECAST = null;
function applyForecastPill() {
  if (!FORECAST || FORECAST.status !== 'estimated' || FORECAST.estimated_adjustment_yuan_per_ton == null) return;
  const est = FORECAST.estimated_adjustment_yuan_per_ton;
  if (Math.abs(est) < 50) return;
  const el = document.getElementById('statusBadge');
  if (!el) return;
  const dir = FORECAST.direction || (est > 0 ? '上调' : '下调');
  el.className = `badge ${est > 0 ? 'badge-error' : 'badge-success'} badge-soft whitespace-nowrap`;
  el.textContent = `预计${dir} ${est} 元/吨`;
}
async function loadForecastPill() {
  try { FORECAST = await j('/api/forecast'); applyForecastPill(); } catch (e) {}
}
async function load() {
  initShared();
  DATA = await j('/api/prices');
  try {
    const hist = await j('/api/history');
    const snaps = (hist.snapshots || []).slice().reverse();
    const hit = snaps.find(s => s.delta && (s.delta.p92 || s.delta.p95 || s.delta.p98 || s.delta.d0));
    if (hit) { LATEST_DELTA = hit.delta; LATEST_DELTA_DATE = fmtDate(hit.fetched_at); }
  } catch (e) {}
  CURRENT = getCurrentProvince();
  if (!DATA.provinces.find(r => r.province === CURRENT)) CURRENT = '上海';
  populateProvinceSelect(document.getElementById('topProvince'), DATA.provinces.map(r => r.province));
  initProvinceSwitcher(() => { renderPrices(); renderAi(); });
  renderPrices(); renderAi(); loadForecastPill();
}
document.getElementById('q').oninput = () => { renderTable(); };
document.getElementById('sortSel').onchange = e => { OIL = e.target.value; renderPrices(); };
document.getElementById('sortDir').onclick = e => { DESC = !DESC; e.target.textContent = DESC ? '↓ 降序' : '↑ 升序'; renderTable(); };
registerSW();
load();
</script></body></html>
